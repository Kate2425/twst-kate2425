<!DOCTYPE html>
<html lang="ja" xmlns:th="https://www.thymeleaf.org">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Delete</title>
        <!-- BootStrap css -->
        <link
            th:href="@{https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css}"
            rel="stylesheet"
            integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM"
            crossorigin="anonymous">
        <link th:href="@{/style/style.css}" rel="stylesheet">
        <link th:href="@{/style/edit.css}" rel="stylesheet">
    </head>

    <body>
        <nav>
            <ul>
                <li><a th:href="@{/edit}">編集</a></li>
            </ul>
        </nav>
        <table>
            <tbody>
                <tr>
                    <th> </th>
                    <th>キャラクター</th>
                    <th>レア度</th>
                    <th>タイプ</th>
                    <th>バディ１</th>
                    <th>バディ２</th>
                    <th>バディ３</th>
                    <th>魔法１</th>
                    <th>魔法２</th>
                    <th>魔法３</th>
                    <th>デュオ</th>
                    <th>初期HP</th>
                    <th>初期ATK</th>
                    <th>最大HP</th>
                    <th>最大ATK</th>
                    <th>所持</th>
                    <th>バディ１効果</th>
                    <th>バディ２効果</th>
                    <th>バディ３効果</th>
                    <th>魔法１効果</th>
                    <th>魔法２効果</th>
                    <th>魔法３効果</th>
                    <th> </th>
                </tr>
                <th:block th:each="record , st: ${cardList}">
                    <form>
                        <tr>
                            <input type="hidden" th:name="tableName"
                                th:value="${record.tableName.name}" />
                            <th th:text="${record.clothingName}"></th>
                            <td th:text="${record.name.viewName}">
                            </td>
                            <input type="hidden" th:name="name"
                                th:value="${record.name.name}" />
                            <td th:text="${record.rare}"></td>
                            <td th:text="${record.type}"></td>
                            <td th:text="${record.buddy1.viewName}"></td>
                            <td th:text="${record.buddy2.viewName}"></td>
                            <td th:text="${record.buddy3.viewName}"></td>
                            <th:block th:switch="${record.magic1.magicType}">
                                <td th:case="'FIRE'" th:class='fire'
                                    th:text="${record.magic1.viewName}"></td>
                                <td th:case="'WATER'" th:class='water'
                                    th:text="${record.magic1.viewName}"></td>
                                <td th:case="'LEAF'" th:class='leaf'
                                    th:text="${record.magic1.viewName}"></td>
                                <td th:case="*"
                                    th:text="${record.magic1.viewName}"></td>
                            </th:block>
                            <th:block th:switch="${record.magic2.magicType}">
                                <td th:case="'FIRE'" th:class='fire'
                                    th:text="${record.magic2.viewName}"></td>
                                <td th:case="'WATER'" th:class='water'
                                    th:text="${record.magic2.viewName}"></td>
                                <td th:case="'LEAF'" th:class='leaf'
                                    th:text="${record.magic2.viewName}"></td>
                                <td th:case="*"
                                    th:text="${record.magic2.viewName}"></td>
                            </th:block>
                            <th:block th:switch="${record.magic3.magicType}">
                                <td th:case="'FIRE'" th:class='fire'
                                    th:text="${record.magic3.viewName}"></td>
                                <td th:case="'WATER'" th:class='water'
                                    th:text="${record.magic3.viewName}"></td>
                                <td th:case="'LEAF'" th:class='leaf'
                                    th:text="${record.magic3.viewName}"></td>
                                <td th:case="*"
                                    th:text="${record.magic3.viewName}"></td>
                            </th:block>
                            <td th:text="${record.duo.viewName}"></td>
                            <td th:text="${record.minHp}"></td>
                            <td th:text="${record.minAtk}"></td>
                            <td th:text="${record.maxHp}"></td>
                            <td th:text="${record.maxAtk}"></td>
                            <td th:text="${record.validFlg}"></td>
                            <td th:text="${record.buddy1Grouping.effect}"></td>
                            <td th:text="${record.buddy2Grouping.effect}"></td>
                            <td th:text="${record.buddy3Grouping.effect}"></td>
                            <td
                                th:text="${record.magic1BuffdebuffGrouping.viewName}"></td>
                            <td
                                th:text="${record.magic2BuffdebuffGrouping.viewName}"></td>
                            <td
                                th:text="${record.magic3BuffdebuffGrouping.viewName}"></td>
                            <td>
                                <button th:formaction="@{/delete}"
                                    th:form="'cardForm' + ${st.index}"
                                    type="button" id="submit"
                                    class="btn submit light-salmon">削除</button>
                            </td>
                        </tr>
                    </form>
                </th:block>
            </tbody>
        </ta>

        <!--/*Bootstrapのモーダルウィンドウ*/-->
        <div class="modal fade" tabindex="-1" id="successMsg"
            aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">完了</h5>
                        <button type="button" class="btn-close"
                            data-bs-dismiss="modal"
                            aria-label="Close"></button>
                    </div>
                    <div class="modal-body">

                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-primary"
                            data-bs-dismiss="modal">OK</button>
                    </div>
                </div>
            </div>
        </div>

        <p th:if="${#lists.isEmpty(cardList)}">条件に一致するカードが存在しません</p>
        <p th:if="${validationError}" th:each="error : ${validationError}"></p>
        <!-- JQuery -->
        <script
            th:src="@{https://code.jquery.com/jquery-3.7.1.min.js}"
            integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
            crossorigin="anonymous"></script>
        <!-- Axios -->
        <script
            th:src="@{https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js}"></script>
        <!-- Popper -->
        <script
            th:src="@{https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js}"
            integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
            crossorigin="anonymous"></script>
        <script
            th:src="@{https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js}"
            integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz"
            crossorigin="anonymous"></script>
        <script th:src="@{/style/edit.js}"></script>
    </body>
</html>
