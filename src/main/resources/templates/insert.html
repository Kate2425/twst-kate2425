<!DOCTYPE html>
<html lang="ja" xmlns:th="https://www.thymeleaf.org">
    <head>
        <meta charset="utf-8">

        <title>Insert</title>
        <link th:href="@{/style/style.css}" rel="stylesheet">
        <link th:href="@{/style/edit.css}" rel="stylesheet">

    </head>

    <body>
        <nav>
            <ul>
                <li><a th:href="@{/edit}">編集</a></li>
            </ul>
        </nav>
        <table>
            <tbody>
                <tr>
                    <th> </th>
                    <th>キャラクター</th>
                    <th>レア度</th>
                    <th>タイプ</th>
                    <th>バディ１</th>
                    <th>バディ２</th>
                    <th>バディ３</th>
                    <th>魔法１</th>
                    <th>魔法２</th>
                    <th>魔法３</th>
                    <th>デュオ</th>
                    <th>初期HP</th>
                    <th>初期ATK</th>
                    <th>最大HP</th>
                    <th>最大ATK</th>
                    <th>所持</th>
                    <th>バディ１効果</th>
                    <th>バディ２効果</th>
                    <th>バディ３効果</th>
                    <th>魔法１効果</th>
                    <th>魔法２効果</th>
                    <th>魔法３効果</th>
                    <th> </th>
                </tr>
                <th:block th:each="record: ${cardList}">
                    <tr>
                        <th th:text="${record.clothingName}"></th>
                        <td th:text="${record.name.viewName}"></td>
                        <td th:text="${record.rare}"></td>
                        <td th:text="${record.type}"></td>
                        <td th:text="${record.buddy1.viewName}"></td>
                        <td th:text="${record.buddy2.viewName}"></td>
                        <td th:text="${record.buddy3.viewName}"></td>
                        <th:block th:switch="${record.magic1.magicType}">
                            <td th:case="'FIRE'" th:class='fire'
                                th:text="${record.magic1.viewName}"></td>
                            <td th:case="'WATER'" th:class='water'
                                th:text="${record.magic1.viewName}"></td>
                            <td th:case="'LEAF'" th:class='leaf'
                                th:text="${record.magic1.viewName}"></td>
                            <td th:case="*"
                                th:text="${record.magic1.viewName}"></td>
                        </th:block>
                        <th:block th:switch="${record.magic2.magicType}">
                            <td th:case="'FIRE'" th:class='fire'
                                th:text="${record.magic2.viewName}"></td>
                            <td th:case="'WATER'" th:class='water'
                                th:text="${record.magic2.viewName}"></td>
                            <td th:case="'LEAF'" th:class='leaf'
                                th:text="${record.magic2.viewName}"></td>
                            <td th:case="*"
                                th:text="${record.magic2.viewName}"></td>
                        </th:block>
                        <th:block th:switch="${record.magic3.magicType}">
                            <td th:case="'FIRE'" th:class='fire'
                                th:text="${record.magic3.viewName}"></td>
                            <td th:case="'WATER'" th:class='water'
                                th:text="${record.magic3.viewName}"></td>
                            <td th:case="'LEAF'" th:class='leaf'
                                th:text="${record.magic3.viewName}"></td>
                            <td th:case="*"
                                th:text="${record.magic3.viewName}"></td>
                        </th:block>
                        <td th:text="${record.duo.viewName}"></td>
                        <td th:text="${record.minHp}"></td>
                        <td th:text="${record.minAtk}"></td>
                        <td th:text="${record.maxHp}"></td>
                        <td th:text="${record.maxAtk}"></td>
                        <td th:text="${record.validFlg}"></td>
                        <td th:text="${record.buddy1Effect}"></td>
                        <td th:text="${record.buddy2Effect}"></td>
                        <td th:text="${record.buddy3Effect}"></td>
                        <td
                            th:text="${record.magic1BuffdebuffGrouping.viewName}"></td>
                        <td
                            th:text="${record.magic2BuffdebuffGrouping.viewName}"></td>
                        <td
                            th:text="${record.magic3BuffdebuffGrouping.viewName}"></td>
                    </tr>
                </th:block>
                <tr>
                    <form action="#" th:action="@{/insert}"
                        th:object="${cardForm}" method="post">

                        <th> </th>
                        <td>
                            <select th:name="name" class="selectbox name">
                                <option th:each=" option: ${characterName}"
                                    th:value="${option.name}"
                                    th:text="${option.viewName}">
                                </option>
                            </select>
                        </td>
                        <td>
                            <select th:name="rare" class="selectbox">
                                <option th:each=" option: ${rare}"
                                    th:value="${option.characterName}"
                                    th:text="${option.viewName}">
                                </option>
                            </select>
                        </td>
                        <td>
                            <select th:name="type" class="selectbox type">
                                <option th:each=" option: ${type}"
                                    th:value="${option.characterName}"
                                    th:text="${option.viewName}">
                                </option>
                            </select>
                        </td>
                        <td>
                            <select th:name="buddy1" class="selectbox name">
                                <option th:each=" option: ${characterName}"
                                    th:value="${option.name}"
                                    th:text="${option.viewName}">
                                </option>
                            </select>
                        </td>
                        <td>
                            <select th:name="buddy2" class="selectbox name">
                                <option th:each=" option: ${characterName}"
                                    th:value="${option.name}"
                                    th:text="${option.viewName}">
                                </option>
                            </select>
                        </td>
                        <td>
                            <select th:name="buddy3" class="selectbox name">
                                <option th:each=" option: ${characterName}"
                                    th:value="${option.name}"
                                    th:text="${option.viewName}">
                                </option>
                            </select>
                        </td>
                        <td>
                            <select th:name="magic1"
                                class="selectbox magic">
                                <option th:each=" option: ${magicGrouping}"
                                    th:value="${option.name}"
                                    th:text="${option.viewName}">
                                </option>
                            </select>
                        </td>
                        <td>
                            <select th:name="magic2"
                                class="selectbox magic">
                                <option th:each=" option: ${magicGrouping}"
                                    th:value="${option.name}"
                                    th:text="${option.viewName}">
                                </option>
                            </select>
                        </td>
                        <td>
                            <select th:name="magic3"
                                class="selectbox magic">
                                <option th:each=" option: ${magicGrouping}"
                                    th:value="${option.name}"
                                    th:text="${option.viewName}">
                                </option>
                            </select>
                        </td>
                        <td>
                            <select th:name="duo" class="selectbox name">
                                <option th:each=" option: ${characterName}"
                                    th:value="${option.name}"
                                    th:text="${option.viewName}">
                                </option>
                            </select>
                        </td>
                        <td><input type="text" th:name="minHp"
                                class="textbox" /></td>
                        <td><input type="text" th:name="minAtk"
                                class="textbox" /></td>
                        <td><input type="text" th:name="maxHp"
                                class="textbox" /></td>
                        <td><input type="text" th:name="maxAtk"
                                class="textbox" /></td>
                        <td>
                            <select th:name="validFlg" class="selectbox valid">
                                <option th:value="true" th:text="所持"></option>
                                <option th:value="false" th:text="未所持"></option>
                            </select>
                        </td>
                        <td>
                            <select th:name="buddy1Grouping"
                                class="selectbox buddyGrouping">
                                <option th:each=" option: ${buddyGrouping}"
                                    th:value="${option.buddyGrouping}"
                                    th:text="${option.effect}">
                                </option>
                            </select>
                        </td>
                        <td>
                            <select th:name="buddy2Grouping"
                                class="selectbox buddyGrouping">
                                <option th:each=" option: ${buddyGrouping}"
                                    th:value="${option.buddyGrouping}"
                                    th:text="${option.effect}">
                                </option>
                            </select>
                        </td>
                        <td>
                            <select th:name="buddy3Grouping"
                                class="selectbox buddyGrouping">
                                <option th:each=" option: ${buddyGrouping}"
                                    th:value="${option.buddyGrouping}"
                                    th:text="${option.effect}">
                                </option>
                            </select>
                        </td>
                        <td>
                            <select th:name="magic1BuffdebuffGrouping"
                                class="selectbox buffDebuffGrouping">
                                <option
                                    th:each=" option: ${buffDebuffGrouping}"
                                    th:value="${option.name}"
                                    th:text="${option.viewName}">
                                </option>
                            </select>
                        </td>
                        <td>
                            <select th:name="magic2BuffdebuffGrouping"
                                class="selectbox buffDebuffGrouping">
                                <option
                                    th:each=" option: ${buffDebuffGrouping}"
                                    th:value="${option.name}"
                                    th:text="${option.viewName}">
                                </option>
                            </select>
                        </td>
                        <td>
                            <select th:name="magic3BuffdebuffGrouping"
                                class="selectbox buffDebuffGrouping">
                                <option
                                    th:each=" option: ${buffDebuffGrouping}"
                                    th:value="${option.name}"
                                    th:text="${option.viewName}">
                                </option>
                            </select>
                        </td>
                        <td><input type="submit" value="登録"
                                class="btn submit" /></td>
                        <input type="hidden" th:name="tableName"
                            th:value="${tableName}" />
                    </form>
                </tr>
            </tbody>
        </ta>
        <p th:if="${#lists.isEmpty(cardList)}">条件に一致するカードが存在しません</p>
        <p th:if="${validationError}" th:each="error : ${validationError}"></p>
    </body>
</html>
