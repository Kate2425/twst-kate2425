<!DOCTYPE html>
<html lang="ja" xmlns:th="https://www.thymeleaf.org">
	<head>
		<meta charset="utf-8">
		<title>Result</title>
		<link th:href="@{/style/style.css}" rel="stylesheet">
		<link th:href="@{/style/result.css}" rel="stylesheet">
	</head>

	<body>
		<nav>
			<ul>
				<li><a th:href="@{/edit}">編集</a></li>
			</ul>
		</nav>
		<table>
			<tbody>
				<tr>
					<th> </th>
					<th>キャラクター</th>
					<th>レア度</th>
					<th>タイプ</th>
					<th>バディ１</th>
					<th>バディ２</th>
					<th>バディ３</th>
					<th>バディ１効果</th>
					<th>バディ２効果</th>
					<th>バディ３効果</th>
					<th>魔法１</th>
					<th>魔法２</th>
					<th>魔法３</th>
					<th>魔法１効果</th>
					<th>魔法２効果</th>
					<th>魔法３効果</th>
					<th>デュオ</th>
					<th>最大HP</th>
					<th>最大ATK</th>
					<th>バディボーナス後HP</th>
					<th>バディボーナス後ATK</th>
				</tr>
				<tr th:each="record , st: ${list}">
					<form action="#" th:action="@{/organize}" th:object="${CardForm}"
						th:name="'cardForm' + ${st.index}" th:method="post">
						<th th:text="${record.clothingName}"></th>
						<td>
							<input type="hidden" th:name="tableName"
								th:value="${record.tableName}" />
							<input type="hidden" th:name="id" th:value="${record.id}" />
							<input type="hidden" th:name="num" th:value="${record.num}" />
							<input type="hidden" th:name="name"
								th:value="${record.name}" />
							<input type="hidden" th:name="clothingName"
								th:value="${record.clothingName}" />
							<input type="hidden" th:name="rare" th:value="${record.rare}" />
							<input type="hidden" th:name="type" th:value="${record.type}" />
							<input type="hidden" th:name="buddy1"
								th:value="${record.buddy1}" />
							<input type="hidden" th:name="buddy1Grouping"
								th:value="${record.buddy1Grouping}" />
							<input type="hidden" th:name="buddy2"
								th:value="${record.buddy2}" />
							<input type="hidden" th:name="buddy2Grouping"
								th:value="${record.buddy2Grouping}" />
							<input type="hidden" th:name="buddy3"
								th:value="${record.buddy3}" />
							<input type="hidden" th:name="buddy3Grouping"
								th:value="${record.buddy3Grouping}" />
							<input type="hidden" th:name="magic1"
								th:value="${record.magic1}" />
							<input type="hidden" th:name="magic2"
								th:value="${record.magic2}" />
							<input type="hidden" th:name="magic3"
								th:value="${record.magic3}" />
							<input type="hidden" th:name="magic1BuffdebuffGrouping"
								th:value="${record.magic1BuffdebuffGrouping}" />
							<input type="hidden" th:name="magic2BuffdebuffGrouping"
								th:value="${record.magic2BuffdebuffGrouping}" />
							<input type="hidden" th:name="magic3BuffdebuffGrouping"
								th:value="${record.magic3BuffdebuffGrouping}" />
							<input type="hidden" th:name="duo"
								th:value="${record.duo}" />
							<input type="hidden" th:name="minHp" th:value="${record.minHp}" />
							<input type="hidden" th:name="minAtk" th:value="${record.minAtk}" />
							<input type="hidden" th:name="maxHp" th:value="${record.maxHp}" />
							<input type="hidden" th:name="maxAtk" th:value="${record.maxAtk}" />
							<inout type="hidden" th:name="reflectedBonusHp"
								th:value="${record.reflectedBonusHp}" />
							<inout type="hidden" th:name="reflectedBonusAtk"
								th:value="${record.reflectedBonusAtk}" />
							<input type="hidden" th:name="arrayIndex" th:value="${arrayIndex}" />
						</form>
						<a href="javascript:"
							th:onclick="'document.forms.cardForm' + __${st.index}__ + '.submit();'">
							<span th:text="${record.name.viewName}"></span>
						</a>
					</td>
					<td th:text="${record.rare}"></td>
					<td th:text="${record.type}"></td>
					<td th:text="${record.buddy1.viewName}"></td>
					<td th:text="${record.buddy2.viewName}"></td>
					<td th:text="${record.buddy3.viewName}"></td>
					<td th:text="${record.buddy1Grouping.effect}"></td>
					<td th:text="${record.buddy2Grouping.effect}"></td>
					<td th:text="${record.buddy3Grouping.effect}"></td>
					<th:block th:switch="${record.magic1.magicType}">
						<td th:case="'FIRE'" th:class='fire'
							th:text="${record.magic1.viewName}"></td>
						<td th:case="'WATER'" th:class='water'
							th:text="${record.magic1.viewName}"></td>
						<td th:case="'LEAF'" th:class='leaf'
							th:text="${record.magic1.viewName}"></td>
						<td th:case="*" th:text="${record.magic1.viewName}"></td>
					</th:block>
					<th:block th:switch="${record.magic2.magicType}">
						<td th:case="'FIRE'" th:class='fire'
							th:text="${record.magic2.viewName}"></td>
						<td th:case="'WATER'" th:class='water'
							th:text="${record.magic2.viewName}"></td>
						<td th:case="'LEAF'" th:class='leaf'
							th:text="${record.magic2.viewName}"></td>
						<td th:case="*" th:text="${record.magic2.viewName}"></td>
					</th:block>
					<th:block th:switch="${record.magic3.magicType}">
						<td th:case="'FIRE'" th:class='fire'
							th:text="${record.magic3.viewName}"></td>
						<td th:case="'WATER'" th:class='water'
							th:text="${record.magic3.viewName}"></td>
						<td th:case="'LEAF'" th:class='leaf'
							th:text="${record.magic3.viewName}"></td>
						<td th:case="*" th:text="${record.magic3.viewName}"></td>
					</th:block>
					<td th:text="${record.magic1BuffdebuffGrouping.viewName}"></td>
					<td th:text="${record.magic2BuffdebuffGrouping.viewName}"></td>
					<td th:text="${record.magic3BuffdebuffGrouping.viewName}"></td>
					<td th:text="${record.duo.viewName}"></td>
					<td th:text="${record.maxHp}"></td>
					<td th:text="${record.maxAtk}"></td>
					<td th:text="${record.reflectedBonusHp}"></td>
					<td th:text="${record.reflectedBonusAtk}"></td>
				</tr>
			</tbody>
		</ta>
		<p th:if="${#lists.isEmpty(list)}">条件に一致するカードが存在しません</p>
		<p th:if="${validationError}" th:each="error : ${validationError}"></p>
	</body>
</html>
