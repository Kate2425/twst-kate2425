<!DOCTYPE html>
<html lang="ja" xmlns:th="https://www.thymeleaf.org">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Update</title>
        <!-- BootStrap css -->
        <link
            th:href="@{https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css}"
            rel="stylesheet"
            integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM"
            crossorigin="anonymous">
        <link th:href="@{/style/style.css}" rel="stylesheet">
        <link th:href="@{/style/edit.css}" rel="stylesheet">
    </head>

    <body>
        <nav>
            <ul>
                <li><a th:href="@{/edit}">編集</a></li>
            </ul>
        </nav>
        <table>
            <tbody>
                <tr>
                    <th> </th>
                    <th>キャラクター</th>
                    <th>レア度</th>
                    <th>タイプ</th>
                    <th>バディ１</th>
                    <th>バディ２</th>
                    <th>バディ３</th>
                    <th>魔法１</th>
                    <th>魔法２</th>
                    <th>魔法３</th>
                    <th>デュオ</th>
                    <th>初期HP</th>
                    <th>初期ATK</th>
                    <th>最大HP</th>
                    <th>最大ATK</th>
                    <th>所持</th>
                    <th>バディ１効果</th>
                    <th>バディ２効果</th>
                    <th>バディ３効果</th>
                    <th>魔法１効果</th>
                    <th>魔法２効果</th>
                    <th>魔法３効果</th>
                    <th> </th>
                </tr>
                <th:block th:each="record , st: ${cardList}">
                    <tr>
                        <th th:text="${record.clothingName}"></th>
                        <td th:text="${record.name.viewName}"></td>
                        <form th:form="'cardForm' + ${st.index}"
                            th:object="${CardForm}">
                            <td>
                                <select th:name="rare" class="selectbox">
                                    <option th:each=" option: ${rare}"
                                        th:value="${option.characterName}"
                                        th:text="${option.viewName}">
                                    </option>
                                </select>
                            </td>
                            <td>
                                <select th:name="type" class="selectbox type">
                                    <option th:each=" option: ${type}"
                                        th:value="${option.characterName}"
                                        th:text="${option.viewName}">
                                    </option>
                                </select>
                            </td>
                            <td>
                                <select th:name="buddy1" class="selectbox name">
                                    <option th:each=" option: ${characterName}"
                                        th:value="${option.name}"
                                        th:text="${option.viewName}">
                                    </option>
                                </select>
                            </td>
                            <td>
                                <select th:name="buddy2" class="selectbox name">
                                    <option th:each=" option: ${characterName}"
                                        th:value="${option.name}"
                                        th:text="${option.viewName}"></option>
                                </select>
                            </td>
                            <td>
                                <select th:name="buddy3" class="selectbox name">
                                    <option th:each=" option: ${characterName}"
                                        th:value="${option.name}"
                                        th:text="${option.viewName}"></option>
                                </select>
                            </td>
                            <td>
                                <select th:name="magic1"
                                    class="selectbox magic">
                                    <option
                                        th:each=" option: ${magic}"
                                        th:value="${option.name}"
                                        th:text="${option.viewName}">
                                    </option>
                                </select>
                            </td>
                            <td>
                                <select th:name="magic2"
                                    class="selectbox magic">
                                    <option
                                        th:each=" option: ${magic}"
                                        th:value="${option.name}"
                                        th:text="${option.viewName}">
                                    </option>
                                </select>
                            </td>
                            <td>
                                <select th:name="magic3"
                                    class="selectbox magic">
                                    <option
                                        th:each=" option: ${magic}"
                                        th:value="${option.name}"
                                        th:text="${option.viewName}">
                                    </option>
                                </select>
                            </td>
                            <td>
                                <select th:name="duo" class="selectbox name">
                                    <option th:each=" option: ${characterName}"
                                        th:value="${option.name}"
                                        th:text="${option.viewName}"></option>
                                </select>
                            </td>
                            <td>
                                <input type="text" th:name="minHp"
                                    th:value="${record.minHp}"
                                    class="textbox" />
                            </td>
                            <td>
                                <input type="text" th:name="minAtk"
                                    th:value="${record.minAtk}"
                                    class="textbox" />
                            </td>
                            <td>
                                <input type="text" th:name="maxHp"
                                    th:value="${record.maxHp}"
                                    class="textbox">
                            </td>
                            <td>
                                <input type="text" th:name="maxAtk"
                                    th:value="${record.maxAtk}"
                                    class="textbox">
                            </td>
                            <td>
                                <select th:name="validFlg"
                                    class="selectbox valid">
                                    <option th:value="true"
                                        th:text="所持"></option>
                                    <option th:value="false"
                                        th:text="未所持"></option>
                                </select>
                            </td>
                            <td>
                                <select th:name="buddy1Grouping"
                                    class="selectbox buddyGrouping">
                                    <option
                                        th:each=" option: ${buddyGrouping}"
                                        th:value="${option.name}"
                                        th:text="${option.effect}">
                                    </option>
                                </select>
                            </td>
                            <td>
                                <select th:name="buddy2Grouping"
                                    class="selectbox buddyGrouping">
                                    <option
                                        th:each=" option: ${buddyGrouping}"
                                        th:value="${option.name}"
                                        th:text="${option.effect}">
                                    </option>
                                </select>
                            </td>
                            <td>
                                <select th:name="buddy3Grouping"
                                    class="selectbox buddyGrouping">
                                    <option
                                        th:each=" option: ${buddyGrouping}"
                                        th:value="${option.name}"
                                        th:text="${option.effect}">
                                    </option>
                                </select>
                            </td>
                            <td>
                                <select th:name="magic1BuffdebuffGrouping"
                                    class="selectbox buffDebuffGrouping">
                                    <option
                                        th:each=" option: ${buffDebuffGrouping}"
                                        th:value="${option.name}"
                                        th:text="${option.viewName}">
                                    </option>
                                </select>
                            </td>
                            <td>
                                <select th:name="magic2BuffdebuffGrouping"
                                    class="selectbox buffDebuffGrouping">
                                    <option
                                        th:each=" option: ${buffDebuffGrouping}"
                                        th:value="${option.name}"
                                        th:text="${option.viewName}">
                                    </option>
                                </select>
                            </td>
                            <td>
                                <select th:name="magic3BuffdebuffGrouping"
                                    class="selectbox buffDebuffGrouping">
                                    <option
                                        th:each=" option: ${buffDebuffGrouping}"
                                        th:value="${option.name}"
                                        th:text="${option.viewName}">
                                    </option>
                                </select>
                            </td>
                            <td>
                                <input type="hidden" th:name="tableName"
                                    th:value="${record.tableName.name}" />
                                <input type="hidden" th:name="name"
                                    th:value="${record.name.name}" />
                                <input type="hidden" th:name="tableViewName"
                                    th:value="${record.tableName.viewName}" />
                                <button th:formaction="@{/update}"
                                    type="button" th:id="'submit' + ${st.index}"
                                    class="btn submit light-blue-purple">更新</button>
                            </td>
                        </form>
                    </tr>
                </th:block>
            </tbody>
        </ta>
        <!--/*Bootstrapのモーダルウィンドウ*/-->
        <div class="modal fade" tabindex="-1" id="successMsg"
            aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">完了</h5>
                        <button type="button" class="btn-close"
                            data-bs-dismiss="modal"
                            aria-label="Close"></button>
                    </div>
                    <div class="modal-body">

                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-primary"
                            data-bs-dismiss="modal">OK</button>
                    </div>
                </div>
            </div>
        </div>

        <p th:if="${#lists.isEmpty(cardList)}">条件に一致するカードが存在しません</p>
        <p th:if="${validationError}"
            th:each="error : ${validationError}"></p>

        <!-- JQuery -->
        <script
            th:src="@{https://code.jquery.com/jquery-3.7.1.min.js}"
            integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
            crossorigin="anonymous"></script>
        <!-- Axios -->
        <script
            th:src="@{https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js}"></script>
        <!-- Popper -->
        <script
            th:src="@{https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js}"
            integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
            crossorigin="anonymous"></script>
        <script
            th:src="@{https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js}"
            integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz"
            crossorigin="anonymous"></script>
        <script th:src="@{/style/edit.js}"></script>
    </body>
</html>
